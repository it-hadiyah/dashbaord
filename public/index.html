<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء تقرير</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="form-page">
  <nav><a href="/list.html">كل التقارير</a></nav>
  <h1>إنشاء تقرير</h1>

  <label class="tpl">نوع التقرير (يعبّي الأقسام تلقائياً وتقدر تعدّلها)
    <select id="tpl"></select>
  </label>

  <form id="f">
    <label>عنوان التقرير *<input name="title" required></label>
    <label>اسم الموظف *<input name="employee" required></label>
    <label>القسم / الإدارة<input name="department"></label>
    <label>التاريخ<input type="date" name="date"></label>

    <div class="wide" id="sections"></div>

    <div class="wide adders">
      <span>إضافة قسم:</span>
      <button type="button" data-add="text">نص</button>
      <button type="button" data-add="list">قائمة نقاط</button>
      <button type="button" data-add="table">جدول</button>
      <button type="button" data-add="kpi">أرقام ومؤشرات</button>
    </div>

    <button class="wide primary" type="submit">إرسال وإنشاء التقرير</button>
    <p id="msg" class="wide"></p>
  </form>
</main>
<script src="/app.js"></script>
</body>
</html>
