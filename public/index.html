<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إنشاء تقرير</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <nav><a href="/list.html">كل التقارير</a></nav>

  <section id="gallery">
    <h1>اختر نموذج التقرير</h1>
    <p class="sub">اختر النموذج الأقرب لتقريرك، وسأرشدك لتعبئة كل قسم خطوة بخطوة مع معاينة مباشرة.</p>
    <div id="cards" class="cards"></div>
  </section>

  <section id="wizard" hidden>
    <div class="topbar">
      <button type="button" id="back-gallery" class="ghost">← تغيير النموذج</button>
      <div id="dots" class="dots"></div>
    </div>
    <div class="wiz">
      <div class="panel">
        <div id="step-count" class="step-count"></div>
        <h2 id="step-title"></h2>
        <p id="step-hint" class="hint"></p>
        <div id="editor"></div>
        <p id="msg" class="msg"></p>
        <div class="nav">
          <button type="button" id="prev" class="ghost">السابق</button>
          <button type="button" id="skip" class="ghost">تخطي هذا القسم</button>
          <button type="button" id="next" class="primary">التالي</button>
        </div>
      </div>
      <div class="previewbox">
        <div class="previewhead">معاينة مباشرة للتقرير</div>
        <iframe id="preview" title="معاينة التقرير"></iframe>
      </div>
    </div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
